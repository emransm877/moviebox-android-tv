plugins { id 'com.android.application' }
android {
    namespace 'org.emransm.moviebox.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'org.emransm.moviebox.tv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        tvRelease {
            if (System.getenv('MOVIEBOX_TV_KEYSTORE')) {
                storeFile file(System.getenv('MOVIEBOX_TV_KEYSTORE'))
                storePassword System.getenv('MOVIEBOX_TV_STORE_PASSWORD')
                keyAlias System.getenv('MOVIEBOX_TV_KEY_ALIAS')
                keyPassword System.getenv('MOVIEBOX_TV_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.tvRelease } }
    if (project.hasProperty('androidTvReleaseTests')) testBuildType 'release'
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
    implementation 'androidx.media3:media3-session:1.8.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
